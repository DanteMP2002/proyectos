<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En construcción</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        :root {
            --negro: #080808;
            --negro-suave: #111111;
            --dorado: #C9A84C;
            --dorado-brillante: #F0C040;
            --dorado-oscuro: #8A6A1A;
            --plata: #B8BCC2;
            --esmeralda: #1A6B55;
            --esmeralda-claro: #22A37C;
            --texto: #E8E0CC;
            --texto-suave: #7A7060;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--negro);
            color: var(--texto);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Fondo con textura sutil dorada */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(201,168,76,.07) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(26,107,85,.06) 0%, transparent 40%),
                radial-gradient(ellipse at 60% 80%, rgba(201,168,76,.04) 0%, transparent 40%);
            pointer-events: none;
        }

        /* Líneas decorativas de fondo */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(201,168,76,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,168,76,.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* ── Volver al portafolio ── */
        .btn-volver {
            position: fixed;
            top: 24px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid var(--dorado-oscuro);
            border-radius: 8px;
            color: var(--dorado);
            font-size: .82rem;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            text-decoration: none;
            background: rgba(201,168,76,.05);
            transition: background .2s, border-color .2s, color .2s;
            z-index: 10;
        }

        .btn-volver:hover {
            background: rgba(201,168,76,.12);
            border-color: var(--dorado);
            color: var(--dorado-brillante);
        }

        .btn-volver svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── Contenido central ── */
        .centro {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
            max-width: 640px;
        }

        /* ── Engranaje animado ── */
        .engranaje-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 40px;
        }

        .engranaje {
            width: 100%;
            height: 100%;
            animation: girar 10s linear infinite;
        }

        .engranaje-pequeño {
            position: absolute;
            width: 48px;
            height: 48px;
            bottom: -10px;
            right: -10px;
            animation: girar-rev 7s linear infinite;
        }

        @keyframes girar {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @keyframes girar-rev {
            from { transform: rotate(0deg); }
            to   { transform: rotate(-360deg); }
        }

        /* ── Etiqueta superior ── */
        .etiqueta {
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--esmeralda-claro);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .etiqueta::before,
        .etiqueta::after {
            content: '';
            display: block;
            width: 28px;
            height: 1px;
            background: var(--esmeralda);
        }

        /* ── Título ── */
        h1 {
            font-size: clamp(2.4rem, 8vw, 4.2rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.05em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--dorado-brillante) 0%, var(--dorado) 45%, var(--plata) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitulo-linea {
            font-size: clamp(1rem, 3vw, 1.35rem);
            font-weight: 300;
            color: var(--plata);
            letter-spacing: .01em;
            margin-bottom: 28px;
        }

        /* ── Descripción ── */
        .descripcion {
            font-size: .95rem;
            line-height: 1.75;
            color: var(--texto-suave);
            max-width: 460px;
            margin-bottom: 44px;
        }

        /* ── Separador ── */
        .separador {
            width: 100%;
            max-width: 320px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--dorado-oscuro), transparent);
            margin-bottom: 44px;
        }

        /* ── Barra de progreso ── */
        .progreso-wrap {
            width: 100%;
            max-width: 340px;
            margin-bottom: 44px;
        }

        .progreso-label {
            display: flex;
            justify-content: space-between;
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--dorado-oscuro);
            margin-bottom: 10px;
        }

        .progreso-label span:last-child {
            color: var(--dorado);
        }

        .barra-fondo {
            width: 100%;
            height: 4px;
            background: rgba(201,168,76,.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .barra-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--dorado-oscuro), var(--dorado-brillante));
            border-radius: 2px;
            animation: llenar 2.2s cubic-bezier(.4,0,.2,1) forwards .4s;
        }

        @keyframes llenar {
            to { width: 42%; }
        }

        /* ── Estado de insignias ── */
        .estados {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .insignia {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 100px;
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .insignia-hecho {
            background: rgba(26,107,85,.15);
            border: 1px solid rgba(34,163,124,.3);
            color: var(--esmeralda-claro);
        }

        .insignia-proceso {
            background: rgba(201,168,76,.1);
            border: 1px solid rgba(201,168,76,.3);
            color: var(--dorado);
        }

        .insignia-pendiente {
            background: rgba(184,188,194,.05);
            border: 1px solid rgba(184,188,194,.15);
            color: var(--texto-suave);
        }

        .punto {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .punto-hecho   { background: var(--esmeralda-claro); }
        .punto-proceso { background: var(--dorado); animation: pulsar 1.4s ease-in-out infinite; }
        .punto-pendiente { background: var(--texto-suave); }

        @keyframes pulsar {
            0%, 100% { opacity: 1; }
            50%       { opacity: .3; }
        }

        /* ── Footer ── */
        .pie {
            position: fixed;
            bottom: 20px;
            font-size: .78rem;
            color: var(--texto-suave);
            letter-spacing: .04em;
            z-index: 1;
        }

        .pie span { color: var(--dorado-oscuro); }

        @media (max-width: 480px) {
            .btn-volver { top: 16px; left: 16px; padding: 8px 14px; font-size: .76rem; }
            .engranaje-wrap { width: 80px; height: 80px; margin-bottom: 28px; }
            .engranaje-pequeño { width: 36px; height: 36px; }
        }
    </style>
</head>
<body>

    <p class="pie">Dante<span>.</span> — Portafolio de proyectos</p>

    <script>
        const fill = document.getElementById('fill');
        const pct  = document.getElementById('pct');
        const target = 42;
        let current = 0;

        const interval = setInterval(() => {
            current = Math.min(current + 1, target);
            pct.textContent = current + '%';
            if (current >= target) clearInterval(interval);
        }, 2200 / target);
    </script>
